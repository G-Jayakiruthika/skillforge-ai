# Runs on every push and pull request. A commit that breaks the engine, trips a
# security check or ships unparseable JavaScript fails here rather than in
# someone's browser.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: Tests and security audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Tests
        working-directory: backend
        run: python -m pytest -q
      - name: Security audit (25 checks, zero failures required)
        working-directory: backend
        run: python security_audit.py
      - name: Knowledge base is in sync with the generated browser copy
        run: |
          python backend/export_knowledge.py
          git diff --exit-code -- frontend/js/knowledge.js \
            || (echo "::error::frontend/js/knowledge.js is stale. Run python backend/export_knowledge.py and commit the result." && exit 1)

  frontend:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Every module parses
        working-directory: frontend
        run: |
          fail=0
          for f in js/*.js; do node --check "$f" || fail=1; done
          exit $fail
      - name: No stray debugger statements or console.log of user data
        working-directory: frontend
        run: |
          if grep -rnE '(^|[^.\w])debugger\b' js/; then
            echo "::error::debugger statement left in the source"; exit 1
          fi
