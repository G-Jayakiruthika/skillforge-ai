# Local or single-server deployment.
#   docker compose up --build
# Then open http://localhost:8000
services:
  app:
    build: .
    image: skillforge-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      # Always on outside localhost: disables the API docs and the demo session.
      SKILLFORGE_PUBLIC: "1"
      SKILLFORGE_DB: /data/skillforge.db
    volumes:
      # Named volume, so accounts and profiles survive a rebuild.
      - skillforge-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  skillforge-data:
